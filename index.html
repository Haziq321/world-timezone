<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Timezone Tracker</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      color:#f1f5f9;
      min-height:100vh;
      padding:30px;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .title{
      text-align:center;
      margin-bottom:25px;
    }

    .title h1{
      font-size:2.2rem;
      margin-bottom:10px;
      color:#38bdf8;
    }

    .title p{
      color:#94a3b8;
    }

    .search-box{
      margin-bottom:20px;
      position:sticky;
      top:0;
      z-index:20;
      background:#0f172a;
      padding-bottom:15px;
    }

    .search-box input{
      width:100%;
      padding:14px 18px;
      border:none;
      border-radius:12px;
      background:#1e293b;
      color:white;
      font-size:1rem;
      outline:none;
      border:2px solid transparent;
      transition:0.3s;
    }

    .search-box input:focus{
      border-color:#38bdf8;
    }

    .table-container{
      background:#111827;
      border-radius:16px;
      overflow:auto;
      max-height:75vh;
      border:1px solid #334155;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }

    thead{
      position:sticky;
      top:0;
      z-index:10;
    }

    thead th{
      background:#1e293b;
      color:#38bdf8;
      padding:16px;
      text-align:left;
      font-size:0.95rem;
      border-bottom:1px solid #334155;
    }

    tbody tr{
      border-bottom:1px solid #1e293b;
      transition:0.2s;
    }

    tbody tr:hover{
      background:#1e293b;
    }

    tbody td{
      padding:14px 16px;
      color:#e2e8f0;
    }

    .flag{
      width:42px;
      height:30px;
      object-fit:cover;
      border-radius:5px;
      border:1px solid #475569;
    }

    .clock{
      font-weight:bold;
      color:#22c55e;
      letter-spacing:1px;
    }

    .loading{
      text-align:center;
      padding:40px;
      color:#94a3b8;
    }

    .footer{
      margin-top:20px;
      text-align:center;
      color:#64748b;
      font-size:0.9rem;
    }

    @media(max-width:768px){

      body{
        padding:15px;
      }

      .title h1{
        font-size:1.6rem;
      }

      .search-box input{
        padding:12px;
      }

      tbody td,
      thead th{
        padding:12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="title">
      <h1>🌍 World Timezone Tracker</h1>
      <p>Live world clock tracker using REST Countries API</p>
    </div>

    <div class="search-box">
      <input 
        type="text" 
        id="searchInput"
        placeholder="Search country or capital city..."
      />
    </div>

    <div class="table-container">

      <table>
        <thead>
          <tr>
            <th>Flag</th>
            <th>Country</th>
            <th>Capital City</th>
            <th>Timezone</th>
            <th>Live Local Time</th>
          </tr>
        </thead>

        <tbody id="tableBody">
          <tr>
            <td colspan="5" class="loading">
              Loading countries data...
            </td>
          </tr>
        </tbody>
      </table>

    </div>

    <div class="footer">
      REST Countries API + Live UTC Clock
    </div>

  </div>

  <script>

    const tableBody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");

    let countriesData = [];
    let clockElements = [];

    // =========================
    // FETCH API DATA
    // =========================
    async function fetchCountries(){

      try{

        const response = await fetch(
          "https://restcountries.com/v3.1/all?fields=name,capital,timezones,flags"
        );

        const data = await response.json();

        countriesData = data
          .filter(country => country.capital && country.timezones)
          .sort((a,b)=>
            a.name.common.localeCompare(b.name.common)
          );

        renderTable(countriesData);

      }catch(error){

        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="loading">
              Failed to load API data.
            </td>
          </tr>
        `;

        console.error(error);
      }
    }

    // =========================
    // RENDER TABLE
    // =========================
    function renderTable(data){

      tableBody.innerHTML = "";
      clockElements = [];

      data.forEach((country,index)=>{

        const row = document.createElement("tr");

        const countryName = country.name.common;
        const capital = country.capital?.[0] || "N/A";
        const timezone = country.timezones?.[0] || "UTC+0";
        const flag = country.flags?.png || "";

        row.innerHTML = `
          <td>
            <img class="flag" src="${flag}" alt="${countryName}">
          </td>

          <td>${countryName}</td>

          <td>${capital}</td>

          <td>${timezone}</td>

          <td class="clock" id="clock-${index}">
            Loading...
          </td>
        `;

        tableBody.appendChild(row);

        clockElements.push({
          element: document.getElementById(`clock-${index}`),
          timezone: timezone
        });
      });

      updateClocks();
    }

    // =========================
    // UTC OFFSET PARSER
    // =========================
    function parseUTCOffset(timezone){

      // Examples:
      // UTC+08:00
      // UTC-04:00
      // UTC+5
      // UTC+09:30

      const match = timezone.match(/UTC([+-])(\d{1,2})(?::(\d{2}))?/);

      if(!match) return 0;

      const sign = match[1] === "+" ? 1 : -1;
      const hours = parseInt(match[2]) || 0;
      const minutes = parseInt(match[3]) || 0;

      return sign * ((hours * 60) + minutes);
    }

    // =========================
    // FORMAT 12-HOUR TIME
    // =========================
    function formatTime(date){

      return date.toLocaleTimeString("en-US",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      });
    }

    // =========================
    // UPDATE CLOCKS
    // ONLY UPDATE TEXT NODE
    // =========================
    function updateClocks(){

      const nowUTC = new Date();

      clockElements.forEach(clock=>{

        const offsetMinutes = parseUTCOffset(clock.timezone);

        const utcTime = nowUTC.getTime() +
          (nowUTC.getTimezoneOffset() * 60000);

        const localTime = new Date(
          utcTime + (offsetMinutes * 60000)
        );

        // ONLY UPDATE TEXT CONTENT
        clock.element.textContent = formatTime(localTime);
      });
    }

    // =========================
    // REAL-TIME SEARCH
    // =========================
    searchInput.addEventListener("input",(e)=>{

      const keyword = e.target.value.toLowerCase();

      const filtered = countriesData.filter(country=>{

        const countryName = country.name.common.toLowerCase();

        const capital =
          country.capital?.[0]?.toLowerCase() || "";

        return (
          countryName.includes(keyword) ||
          capital.includes(keyword)
        );
      });

      renderTable(filtered);
    });

    // =========================
    // INITIALIZE
    // =========================
    fetchCountries();

    // UPDATE ONLY CLOCK TEXT EVERY SECOND
    setInterval(updateClocks,1000);

  </script>

</body>
</html>
