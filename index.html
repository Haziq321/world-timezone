<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zon Masa Dunia (Hibrid 3D & 2D)</title>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
        }

        /* ----- Komponen UI Utama ----- */
        .panel-kawalan {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.85);
            padding: 20px;
            border-radius: 10px;
            z-index: 20;
            width: 320px;
            border: 1px solid #333;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #3498db;
        }

        p.desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
        }

        button.toggle-btn {
            width: 100%;
            padding: 10px;
            background: #2c3e50;
            color: white;
            border: 1px solid #34495e;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button.toggle-btn:hover {
            background: #34495e;
        }

        #status {
            color: #f1c40f;
            font-size: 13px;
            margin-bottom: 10px;
        }

        /* ----- Mod 3D Globe ----- */
        #globeViz {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        .info-panel {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #444;
        }

        .info-panel.active {
            display: block;
        }

        .time-display {
            font-size: 26px;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0 5px 0;
            font-variant-numeric: tabular-nums;
            text-align: center;
            background: #111;
            padding: 10px;
            border-radius: 5px;
        }

        .flag-3d {
            width: 35px;
            border-radius: 3px;
            vertical-align: middle;
            margin-right: 10px;
        }

        .data-row {
            margin-top: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .data-row span {
            color: white;
            font-weight: 500;
        }

        /* ----- Mod 2D Jadual ----- */
        #tableViz {
            display: none;
            /* Sembunyi secara lalai */
            position: absolute;
            top: 20px;
            left: 360px;
            /* Letak di sebelah kanan panel kawalan */
            right: 20px;
            bottom: 20px;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 10px;
            border: 1px solid #333;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #1a1a1a;
            color: #3498db;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        .time-cell-2d {
            font-weight: bold;
            color: #e74c3c;
            font-variant-numeric: tabular-nums;
        }

        .flag-2d {
            width: 30px;
            border-radius: 3px;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
        }

        /* Responsif untuk skrin kecil (Telefon) */
        @media (max-width: 768px) {
            .panel-kawalan {
                position: relative;
                top: 0;
                left: 0;
                width: 100%;
                border-radius: 0;
                border: none;
                border-bottom: 1px solid #333;
            }

            #globeViz {
                top: 180px;
                height: calc(100vh - 180px);
            }

            #tableViz {
                top: 180px;
                left: 0;
                right: 0;
                bottom: 0;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>

<body>

    <!-- Panel Kawalan Utama -->
    <div class="panel-kawalan">
        <h2>Penjejak Zon Masa</h2>
        <p class="desc" id="teks-mod">Mod Aktif: <b>Bumi 3D</b></p>

        <div id="status">Memuat turun data & tekstur...</div>
        <input type="text" id="carian" placeholder="Cari negara atau bandar...">
        <button id="btnToggle" class="toggle-btn" style="display:none;" onclick="tukarMod()">Tukar ke Mod 2D
            (Jadual)</button>

        <!-- Info Panel (Hanya papar ketika Mod 3D) -->
        <div id="infoPanel" class="info-panel">
            <div>
                <img id="pBendera" class="flag-3d" src="" alt="Bendera">
                <span id="pNegara" style="font-size: 16px; font-weight: bold;"></span>
            </div>
            <div class="data-row">Bandar: <span id="pBandar"></span></div>
            <div class="data-row">Zon Masa: <span id="pZonMasa"></span></div>
            <div class="time-display" id="pMasa"></div>
        </div>
    </div>

    <!-- Kontena 3D Globe -->
    <div id="globeViz"></div>

    <!-- Kontena 2D Jadual -->
    <div id="tableViz">
        <table>
            <thead>
                <tr>
                    <th>Bendera</th>
                    <th>Negara</th>
                    <th>Ibu Negara</th>
                    <th>UTC</th>
                    <th>Waktu Semasa</th>
                </tr>
            </thead>
            <tbody id="senarai-bandar"></tbody>
        </table>
    </div>

    <script>
        let dataGlobal = [];
        let mod3D = true; // Status mod semasa

        // Pembolehubah 3D
        let negaraPilihan3D = null;
        let globe = null;

        // Inisialisasi Aplikasi
        // Inisialisasi Aplikasi
        // Inisialisasi Aplikasi
        async function mulakanAplikasi() {
            try {
                // 1. Tambah 'capitalInfo' dalam URL API untuk dapatkan koordinat tepat ibu negara
                const res = await fetch('https://restcountries.com/v3.1/all?fields=name,capital,timezones,flags,latlng,capitalInfo');
                const dataRaw = await res.json();

                // 2. Bersihkan dan format data dengan logik saringan zon masa
                dataGlobal = dataRaw.filter(item => item.latlng && item.latlng.length === 2 && item.capital.length > 0)
                    .map(item => {
                        // Guna koordinat spesifik ibu negara (jika tiada, guna titik tengah negara)
                        const latBandar = item.capitalInfo?.latlng?.[0] || item.latlng[0];
                        const lngBandar = item.capitalInfo?.latlng?.[1] || item.latlng[1];
                        
                        let zonMasaTepat = item.timezones[0];

                        // LOGIK PEMBETULAN: Jika negara ada lebih dari 1 zon masa
                        if (item.timezones.length > 1) {
                            // Anggaran offset berdasarkan putaran bumi (Longitud / 15 darjah)
                            const anggaranOffset = Math.round(lngBandar / 15);
                            
                            let bezaTerdekat = 999;
                            item.timezones.forEach(tz => {
                                let jam = 0;
                                if (tz !== "UTC") {
                                    const tanda = tz.includes('-') ? -1 : 1;
                                    const angka = tz.replace('UTC', '').replace('+', '').replace('-', '').split(':');
                                    // Tukar format rentetan ke nombor perpuluhan
                                    jam = tanda * (parseInt(angka[0]) + (parseInt(angka[1])/60 || 0));
                                }
                                
                                // Cari zon masa yang paling padan dengan lokasi koordinat ibu negara
                                const beza = Math.abs(jam - anggaranOffset);
                                if (beza < bezaTerdekat) {
                                    bezaTerdekat = beza;
                                    zonMasaTepat = tz;
                                }
                            });
                        }

                        return {
                            name: item.name.common,
                            capital: item.capital[0],
                            lat: latBandar,
                            lng: lngBandar,
                            timezone: zonMasaTepat,
                            flag: item.flags.svg
                        };
                    }).sort((a, b) => a.name.localeCompare(b.name));

                // 3. Sediakan 3D Globe
                globe = Globe()(document.getElementById('globeViz'))
                    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                    .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
                    .pointAltitude(0.05)
                    .pointColor(() => '#e74c3c')
                    .pointRadius(0.5)
                    .pointResolution(32)
                    .pointLabel(d => `<b>${d.capital}</b>, ${d.name}`)
                    .pointsData(dataGlobal)
                    .onPointClick(d => {
                        globe.controls().autoRotate = false;
                        fokusNegara3D(d);
                    });
                
                globe.controls().autoRotate = true;
                globe.controls().autoRotateSpeed = 0.5;

                // 4. Papar data ke Jadual 2D
                binaJadual2D('');

                // 5. Kemaskini UI
                document.getElementById('status').style.display = 'none';
                document.getElementById('btnToggle').style.display = 'block';

                // 6. Mulakan jam
                setInterval(kemaskiniJamInduk, 1000);

            } catch (error) {
                document.getElementById('status').innerText = "Ralat memuat turun data API.";
                console.error(error);
            }
        }
        // Fungsi menukar antara 3D dan 2D
        function tukarMod() {
            mod3D = !mod3D;
            const btn = document.getElementById('btnToggle');
            const teksMod = document.getElementById('teks-mod');

            if (mod3D) {
                document.getElementById('globeViz').style.display = 'block';
                document.getElementById('tableViz').style.display = 'none';
                document.getElementById('infoPanel').style.display = negaraPilihan3D ? 'block' : 'none';
                btn.innerText = "Tukar ke Mod 2D (Jadual)";
                teksMod.innerHTML = "Mod Aktif: <b>Bumi 3D</b>";
                if (!document.getElementById('carian').value) globe.controls().autoRotate = true;
            } else {
                document.getElementById('globeViz').style.display = 'none';
                document.getElementById('tableViz').style.display = 'block';
                document.getElementById('infoPanel').style.display = 'none';
                btn.innerText = "Tukar ke Mod 3D (Bumi)";
                teksMod.innerHTML = "Mod Aktif: <b>Jadual 2D</b>";
                binaJadual2D(document.getElementById('carian').value); // Kekalkan tapisan carian jika ada
            }
        }

        // Fungsi carian
        document.getElementById('carian').addEventListener('input', (e) => {
            const kataKunci = e.target.value.toLowerCase();

            if (mod3D) {
                if (!kataKunci) {
                    globe.controls().autoRotate = true;
                    return;
                }
                const hasil = dataGlobal.find(d => d.name.toLowerCase().includes(kataKunci) || d.capital.toLowerCase().includes(kataKunci));
                if (hasil) {
                    globe.controls().autoRotate = false;
                    fokusNegara3D(hasil);
                }
            } else {
                binaJadual2D(kataKunci);
            }
        });

        // ------------------ LOGIK 3D ------------------
        function fokusNegara3D(data) {
            negaraPilihan3D = data;
            globe.pointOfView({ lat: data.lat, lng: data.lng, altitude: 1.5 }, 1200);

            document.getElementById('infoPanel').classList.add('active');
            document.getElementById('infoPanel').style.display = 'block';
            document.getElementById('pBendera').src = data.flag;
            document.getElementById('pNegara').innerText = data.name;
            document.getElementById('pBandar').innerText = data.capital;
            document.getElementById('pZonMasa').innerText = data.timezone;

            // Kemaskini masa serta merta tanpa tunggu 1 saat
            kemaskiniJamInduk();
        }

        // ------------------ LOGIK 2D ------------------
        function binaJadual2D(kataKunci) {
            const tbody = document.getElementById('senarai-bandar');
            tbody.innerHTML = '';

            const dataTapis = dataGlobal.filter(item =>
                item.name.toLowerCase().includes(kataKunci) || item.capital.toLowerCase().includes(kataKunci)
            );

            dataTapis.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${item.flag}" class="flag-2d" alt="Bendera ${item.name}"></td>
                    <td>${item.name}</td>
                    <td>${item.capital}</td>
                    <td>${item.timezone}</td>
                    <td class="time-cell-2d" data-utc="${item.timezone}">${kiraWaktu(item.timezone)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ------------------ LOGIK MASA INDUK ------------------
        function kiraWaktu(utcString) {
            if (!utcString || utcString === "UTC") utcString = "UTC+00:00";
            const tanda = utcString.includes('-') ? -1 : 1;
            const bahagian = utcString.replace('UTC', '').replace('+', '').replace('-', '').split(':');

            const jam = parseInt(bahagian[0]) || 0;
            const minit = parseInt(bahagian[1]) || 0;
            const offsetMilisaat = tanda * ((jam * 3600000) + (minit * 60000));

            const sekarang = new Date();
            const waktuUTC = sekarang.getTime() + (sekarang.getTimezoneOffset() * 60000);
            return new Date(waktuUTC + offsetMilisaat).toLocaleTimeString('ms-MY', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
            });
        }

        // Mengawal kemaskini masa berdasarkan mod yang sedang aktif
        function kemaskiniJamInduk() {
            if (mod3D && negaraPilihan3D) {
                const pMasa = document.getElementById('pMasa');
                if (pMasa) pMasa.innerText = kiraWaktu(negaraPilihan3D.timezone);
            }
            else if (!mod3D) {
                const selMasa2D = document.querySelectorAll('.time-cell-2d');
                selMasa2D.forEach(sel => {
                    sel.innerText = kiraWaktu(sel.getAttribute('data-utc'));
                });
            }
        }

        // Mula jalan program
        mulakanAplikasi();
    </script>
</body>

</html>
